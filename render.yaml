databases:
  - name: breathe-esg-db
    plan: free
    databaseName: breathe_esg
    user: breathe_user

services:
  - type: web
    name: breathe-esg-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn breathe_backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set this manually in Render dashboard to your Netlify URL
